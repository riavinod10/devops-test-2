---
# Validates host configuration for each tier using the connection files
# generated by Terraform (../generated/). Run from the ansible/ directory:
#   ansible-playbook -i generated/inventory.ini playbooks/validate-hosts.yml
#
# Hard checks (fail the play): OS/python facts, generated files present and
# well-formed, tier variables consistent with connection.json, valid ports.
# Soft checks (reported, never fatal): HTTP reachability of the deployed stack
# from this host - WSL may not see Windows localhost depending on networking mode.

- name: Validate payment-engine host configurations
  hosts: payment_engine
  gather_facts: true

  vars:
    generated_dir: "{{ playbook_dir }}/../generated"
    connection_file: "{{ generated_dir }}/connection.json"
    env_file: "{{ generated_dir }}/app.env"
    report_file: "{{ generated_dir }}/validation-report.txt"
    min_python: "3.8"
    min_free_mb: 500
    required_env_keys:
      - PROJECT_NAME
      - APP_ENV
      - APP_VERSION
      - K8S_NAMESPACE
      - BACKEND_HOST
      - BACKEND_PORT
      - BACKEND_URL
      - FRONTEND_URL

  tasks:
    - name: Check generated connection files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ connection_file }}"
        - "{{ env_file }}"
      register: generated_stat

    - name: Fail if Terraform has not generated the files
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.size > 0
        fail_msg: "{{ item.item }} missing or empty - run 'terraform apply' in terraform/ first."
        success_msg: "{{ item.item | basename }} present ({{ item.stat.size }} bytes)"
        quiet: false
      loop: "{{ generated_stat.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Load connection.json
      ansible.builtin.set_fact:
        conn: "{{ lookup('ansible.builtin.file', connection_file) | from_json }}"

    - name: Load app.env keys
      ansible.builtin.set_fact:
        env_keys: >-
          {{ lookup('ansible.builtin.file', env_file).splitlines()
             | reject('match', '^\s*(#|$)')
             | map('regex_replace', '=.*$', '')
             | list }}

    - name: Validate operating system and Python
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['python_version'] is version(min_python, '>=')
        fail_msg: "Host must be Linux with Python >= {{ min_python }}"
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          Python {{ ansible_facts['python_version'] }}

    - name: Validate free disk space on /
      vars:
        root_mount: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | first }}"
      ansible.builtin.assert:
        that: (root_mount.size_available / 1048576) | int >= min_free_mb
        fail_msg: "Less than {{ min_free_mb }} MB free on /"
        success_msg: "{{ (root_mount.size_available / 1048576) | int }} MB free on /"

    - name: Validate connection.json structure
      ansible.builtin.assert:
        that:
          - conn.project | length > 0
          - conn.app_version == app_version
          - conn.environment == app_environment
          - conn.kubernetes.namespace == k8s_namespace
          - conn.kubernetes.backend.service == 'payment-backend'
          - conn.kubernetes.frontend.service == 'payment-frontend'
        fail_msg: "connection.json does not match inventory variables"
        success_msg: "connection.json matches inventory (version {{ app_version }}, ns {{ k8s_namespace }})"

    - name: Validate app.env contains all required keys
      ansible.builtin.assert:
        that: required_env_keys | difference(env_keys) | length == 0
        fail_msg: "app.env missing keys: {{ required_env_keys | difference(env_keys) }}"
        success_msg: "app.env has all {{ required_env_keys | length }} required keys"

    - name: Validate tier-specific port configuration
      vars:
        tier_conn: "{{ conn.kubernetes[tier] }}"
      ansible.builtin.assert:
        that:
          - service_port | int == tier_conn.service_port | int
          - node_port | int == tier_conn.node_port | int
          - node_port | int >= 30000
          - node_port | int <= 32767
          - service_port | int > 0
          - service_port | int < 65536
        fail_msg: "{{ tier }} ports inconsistent with connection.json"
        success_msg: "{{ tier }}: service port {{ service_port }}, NodePort {{ node_port }}"

    - name: Probe deployed {{ tier }} endpoint (soft check)
      ansible.builtin.uri:
        url: "http://{{ endpoint_host }}:{{ node_port }}{{ health_path }}"
        return_content: false
        timeout: 5
      register: probe
      failed_when: false
      changed_when: false

    - name: Record per-host result
      ansible.builtin.set_fact:
        host_result: >-
          {{ inventory_hostname }} ({{ tier }}): config VALID;
          endpoint http://{{ endpoint_host }}:{{ node_port }}{{ health_path }} ->
          {{ 'HTTP ' ~ probe.status if (probe.status | default(-1)) > 0 else 'unreachable from this host' }}

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ host_result }}"

    - name: Write validation report
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        content: |
          Payment Engine - host configuration validation
          Generated: {{ ansible_facts['date_time']['iso8601'] }}
          Host OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}, Python {{ ansible_facts['python_version'] }}
          {% for h in ansible_play_hosts | sort %}
          - {{ hostvars[h].host_result }}
          {% endfor %}
      run_once: true
