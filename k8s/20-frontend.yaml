apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-frontend
  namespace: payment-engine
  labels:
    app.kubernetes.io/name: payment-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: payment-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: payment-engine
    spec:
      containers:
        - name: payment-frontend
          image: payment-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_HOST
              value: "payment-backend"   # Kubernetes Service DNS name (same namespace)
            - name: BACKEND_PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: payment-frontend
  namespace: payment-engine
  labels:
    app.kubernetes.io/name: payment-frontend
    app.kubernetes.io/part-of: payment-engine
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payment-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31080
