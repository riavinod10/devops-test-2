apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-backend-config
  namespace: payment-engine
  labels:
    app.kubernetes.io/name: payment-backend
    app.kubernetes.io/part-of: payment-engine
data:
  APP_ENV: "kubernetes"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-backend
  namespace: payment-engine
  labels:
    app.kubernetes.io/name: payment-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: payment-engine
spec:
  # 1 replica: the backend keeps state in memory (no database in scope).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: payment-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: payment-backend
          image: payment-backend:1.0.0
          imagePullPolicy: IfNotPresent   # use the image built locally in Docker Desktop
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: payment-backend-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Service name "payment-backend" is what the frontend nginx proxies to.
apiVersion: v1
kind: Service
metadata:
  name: payment-backend
  namespace: payment-engine
  labels:
    app.kubernetes.io/name: payment-backend
    app.kubernetes.io/part-of: payment-engine
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payment-backend
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
