<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment &amp; Notification Engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Payment &amp; Notification Engine</h1>
    <span id="health" class="badge badge-unknown">Backend: checking…</span>
  </header>

  <main>
    <section class="card">
      <h2>New payment</h2>
      <form id="payment-form" novalidate>
        <label>Payer <input name="payer" required maxlength="100" placeholder="Alice"></label>
        <label>Payee <input name="payee" required maxlength="100" placeholder="Bob"></label>
        <label>Amount <input name="amount" required type="number" min="0.01" max="1000000" step="0.01" placeholder="1500.00"></label>
        <label>Currency
          <select name="currency">
            <option>INR</option><option>USD</option><option>EUR</option><option>GBP</option>
          </select>
        </label>
        <label>Method
          <select name="method">
            <option>UPI</option><option>CARD</option><option>NETBANKING</option><option>WALLET</option>
          </select>
        </label>
        <button type="submit">Send payment</button>
        <p id="form-msg" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Stats</h2>
      <div id="stats">—</div>
    </section>

    <section class="card wide">
      <h2>Payments</h2>
      <table>
        <thead><tr><th>Time (UTC)</th><th>Payer</th><th>Payee</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead>
        <tbody id="payments"><tr><td colspan="6">No payments yet</td></tr></tbody>
      </table>
    </section>

    <section class="card wide">
      <h2>Notifications</h2>
      <ul id="notifications"><li>No notifications yet</li></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
